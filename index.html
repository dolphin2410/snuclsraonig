<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RAONI - 황금열쇠</title>
    <style>
        body {
            font-family: 'Noto Sans KR', sans-serif;
            background-color: #1a1a1a;
            color: #ffffff;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
        }

        .card-container {
            perspective: 1000px;
            cursor: pointer;
            margin-bottom: 40px;
        }

        .card {
            width: 200px;
            height: 300px;
            position: relative;
            transform-style: preserve-3d;
            transition: transform 0.6s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .card.flipped {
            transform: rotateY(180deg);
        }

        .card-face {
            position: absolute;
            width: 100%;
            height: 100%;
            backface-visibility: hidden;
            border-radius: 15px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            box-shadow: 0 10px 20px rgba(0,0,0,0.5);
            border: 3px solid #ffd700;
        }

        .card-front {
            background: linear-gradient(135deg, #b8860b, #ffd700);
            color: #1a1a1a;
        }

        .card-front .icon {
            margin-bottom: 10px;
        }

        .card-front .text {
            font-weight: bold;
            font-size: 18px;
            letter-spacing: 2px;
        }

        .card-back {
            background-color: #2c2c2c;
            transform: rotateY(180deg);
            padding: 20px;
            box-sizing: border-box;
            text-align: center;
        }

        .result-name {
            font-size: 24px;
            font-weight: bold;
            color: #ffd700;
            margin-bottom: 15px;
            word-break: keep-all;
        }
    </style>
</head>
<body>
    <div class="card-container" onclick="drawKey()">
        <div class="card" id="goldCard">
            <div class="card-face card-front">
                <div class="icon"><img src="./key.png" width="100px"></div>
                <div class="text">황금 열쇠</div>
            </div>
            <div class="card-face card-back">
                <div class="result-name" id="resultName">-</div>
                <div class="result-description" id="resultDescription">-</div>
            </div>
        </div>
    </div>

    <script>
        const keyList = [
            { 
                name: "즉시 귀가", 
                weight: 5, 
                description: "뽀삐가 주인님을 기다리고 있습니다." 
            },
            {
                name: '과준위 의리주',
                weight: 1,
                description: '과준위는 함께하라~'
            },
            {
                name: '엠준위 의리주',
                weight: 1,
                description: '엠준위는 함께하라~'
            },
            {
                name: '패배루카 의리주',
                weight: 5,
                description: '패배루카는 함께하라~'
            },
            {
                name: '평창 올림픽이 개최 되었습니다',
                weight: 5,
                description: '기쁜 마음으로 한 잔~'
            },
            {
                name: '07 의리주',
                weight: 5,
                description: '07은 함께하라~'
            },
            {
                name: '06 의리주',
                weight: 5,
                description: '06은 함께하라~'
            },
            {
                name: '04 05 08 의리주',
                weight: 1,
                description: '04 05 08은 함께하라~'
            },
            {
                name: '라온은 사랑을 싣고 1',
                weight: 20,
                description: '흑기사 해주고 싶은 이성 지목'
            },
            {
                name: '최강 라온',
                weight: 5,
                description: '질 수 없다 뻔대~'
            },
            {
                name: '반장단 의리주',
                weight: 5,
                description: '반장단은 함께하라~'
            },
            {
                name: '라온은 사랑을 싣고 2',
                weight: 20,
                description: '가장 이상형에 가까운 이성과 마시기'
            },
            {
                name: '라온은 사랑을 싣고 3',
                weight: 20,
                description: '가장 이상형에 가까운 이성과 웃지 않고 3초 눈맞춤'
            },
            {
                name: '학생회 의리주',
                weight: 5,
                description: '학생회는 함께하라~'
            },
            {
                name: '라온은 사랑을 싣고 4',
                weight: 20,
                description: '귓속말 게임 3번 돌기'
            },
            {
                name: '아 공부하고 싶다',
                weight: 5,
                description: '야자 타임 10분'
            },
            {
                name: '라온은 사랑을 싣고 5',
                weight: 20,
                description: '가장 이상형에 가까운 사람과 상메 맞추기'
            }
        ];

        // 전체 가중치 합산 계산
        const totalWeight = keyList.reduce((sum, item) => sum + item.weight, 0);
        let isFlipped = false;


        function getRandomItem() {
            let randomNum = Math.random() * totalWeight;
            
            for (let i = 0; i < keyList.length; i++) {
                if (randomNum < keyList[i].weight) {
                    return keyList[i];
                }
                randomNum -= keyList[i].weight;
            }
            return keyList[keyList.length - 1];
        }

        function drawKey() {
            if (isFlipped) {
                resetCard()
                return
            }

            isFlipped = true;
            const card = document.getElementById('goldCard');
            const resultName = document.getElementById('resultName');

            const pickedItem = getRandomItem();
            const currentProb = ((pickedItem.weight / totalWeight) * 100).toFixed(1);

            resultName.innerText = pickedItem.name;
            const resultDescription = document.getElementById('resultDescription');
            resultDescription.innerText = pickedItem.description || '';

            card.classList.add('flipped');
        }

        function resetCard() {
            if (!isFlipped) return;

            const card = document.getElementById('goldCard');

            card.classList.remove('flipped');
            
            isFlipped = false;
        }
    </script>
</body>
</html>
